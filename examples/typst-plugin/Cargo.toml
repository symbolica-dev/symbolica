[package]
name = "symbolica-typst-plugin-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "symbolica_typst_plugin"
crate-type = ["cdylib"]

[dependencies]
getrandom = "0.3"
symbolica = { path = "../..", default-features = false, features = ["wasm"] }
wasm-minimal-protocol = "0.1"

# Keep this example independent from Symbolica's workspace so it can be copied
# out and built on its own.
[workspace]

[profile.release]
codegen-units = 1
lto = true
strip = true

[patch.crates-io]
graphica = { path = "../../lib/graphica" }
numerica = { path = "../../lib/numerica" }
